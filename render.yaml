# Render Blueprint for the ResumeIQ backend (free web service).
# In Render: New + → Blueprint → pick this repository. Render reads this file.
services:
  - type: web
    name: resumeiq-harsh
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_PROVIDER
        value: auto
      # Paste your Gemini key in the Render dashboard (left empty = offline analyzer)
      - key: GEMINI_API_KEY
        sync: false
      # Allows the Vercel site (any project name starting with "resumeiq") to call the API
      - key: CORS_ORIGIN_REGEX
        value: https://resumeiq.*\.vercel\.app
