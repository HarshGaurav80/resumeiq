<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ResumeIQ – AI Resume Analyzer. Get your resume job-ready with ATS scoring, skill gap analysis and AI suggestions." />
    <title>ResumeIQ – AI Resume Analyzer</title>
    <!-- Apply saved theme before first paint to avoid a flash (default: light) -->
    <script>
      (function () {
        var t = localStorage.getItem("resumeiq-theme");
        if (t === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
